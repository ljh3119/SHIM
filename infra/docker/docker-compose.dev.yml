services:
  shim:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ${SHIM_IMAGE:-shim:1.8.7}
    container_name: shim
    ports:
      - "8000:8000"
    environment:
      # Dev: optional `.env` with SHIM_SECRET_KEY
      SHIM_SECRET_KEY: ${SHIM_SECRET_KEY:-shim_change_this_secret_key_before_operation}
      TZ: ${TZ:-UTC} # 타임존 설정 (기본값: UTC, .env 파일에서 변경 가능)
    volumes:
      - ${SHIM_DATA_DIR:-../../var/data}:/app/var/data
    restart: unless-stopped
