services:
  shim-test:
    image: ${SHIM_IMAGE:-shim:1.7.1}
    container_name: shim-test
    ports:
      - "8000:8000"
    environment:
      # 1. 컨테이너 내부 OS 시각(TZ)은 UTC로 강제 고정
      TZ: "UTC"
      
      # 2. 안전한 기본값(Fallback) 주입 구조
      # (호스트 .env 파일 등에서 변수를 명시적으로 설정하지 않을 경우 기본값 적용)
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
      SHIM_TIMEZONE_OFFSET_HOURS: ${SHIM_TIMEZONE_OFFSET_HOURS:-9.0}
      
      # 3. 데이터베이스 및 보안 비밀키 설정
      SHIM_SECRET_KEY: ${SHIM_SECRET_KEY:-shim_change_this_secret_key_before_operation}
    volumes:
      - ${SHIM_DATA_DIR:-../../var/data}:/app/var/data
    restart: unless-stopped
