{# 관리자 공통 사이드바 — 메인 내비. 상단 바와 경로 중복 없음. #}
{% set path = request.url.path %}
<aside id="shim-sidebar-admin" data-shim-sidebar class="shim-sidebar relative flex w-full md:w-[188px] shrink-0 flex-col gap-2 md:gap-3 self-start overflow-visible min-h-0 md:min-h-[calc(100vh-6rem)]">
  <button type="button" class="shim-sidebar-toggle hidden md:flex absolute -right-3 top-2.5 z-10 h-7 w-7 shrink-0 items-center justify-center rounded-[4px] border border-dense-line bg-dense-surface text-dense-nav-text shadow-xs transition-colors hover:bg-dense-surface-soft" aria-label="사이드 패널 접기·펼치기" aria-expanded="true" aria-controls="shim-sidebar-admin-nav"></button>
  
  <!-- Navigation Card -->
  <div class="rounded-[4px] border border-dense-line bg-dense-surface md:bg-dense-gray-soft p-1.5 md:p-2 shadow-xs flex flex-col gap-1">
    <nav id="shim-sidebar-admin-nav" class="flex flex-row md:flex-col gap-0.5 overflow-x-auto md:overflow-visible scrollbar-none pb-0.5 md:pb-0" aria-label="관리자 메뉴">
      <a href="/admin/dashboard" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path == '/admin/dashboard' %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">대시보드</span>
      </a>
      <a href="/admin/leave/calendar" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path.startswith('/admin/leave/calendar') and request.query_params.get('tab') != 'timeline' %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">연차 캘린더</span>
      </a>
      <a href="/admin/leave/timeline" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path.startswith('/admin/leave/timeline') or (path.startswith('/admin/leave/calendar') and request.query_params.get('tab') == 'timeline') %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">신청 타임라인</span>
      </a>
      <a href="/admin/holidays" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path.startswith('/admin/holidays') %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">공휴일 관리</span>
      </a>
      <a href="/admin/master" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path.startswith('/admin/master') %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">마스터 관리</span>
      </a>
      <a href="/admin/users" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path.startswith('/admin/users') %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">사용자 관리</span>
      </a>
      <a href="/admin/audit" class="shim-side-link shrink-0 whitespace-nowrap min-h-[2.25rem] px-2 py-1.5 text-xs md:text-[13px] rounded-[4px] {% if path.startswith('/admin/audit') %}bg-dense-blue-soft text-dense-blue font-semibold{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
        <span class="shim-side-emoji flex items-center justify-center w-4 h-4 shrink-0">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span class="shim-nav-label min-w-0 truncate">감사 로그</span>
      </a>
    </nav>
  </div>

  <!-- System Stats Card (Desktop only) -->
  <div class="system-stats-card hidden md:block rounded-[4px] border border-dense-line bg-dense-surface p-3 shadow-xs space-y-2">
    <h4 class="text-[11px] font-semibold text-dense-muted">시스템 현황</h4>
    <div class="space-y-1 text-xs">
      <div class="flex justify-between font-normal">
        <span class="text-dense-muted">활성 사용자</span>
        <span id="stat-active-users" class="text-dense-text font-semibold tabular-nums">{{ active_users_count | default(0) }}명</span>
      </div>
      <div class="flex justify-between font-normal">
        <span class="text-dense-muted">결재 대기 건수</span>
        <span id="stat-pending-count" class="text-dense-amber font-semibold tabular-nums">{{ pending_leaves_count | default(0) }}건</span>
      </div>
    </div>
  </div>
</aside>
