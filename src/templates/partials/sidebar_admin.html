{# 관리자 공통 사이드바 — 메인 내비. 상단 바와 경로 중복 없음. #}
{% set path = request.url.path %}
<aside id="shim-sidebar-admin" data-shim-sidebar class="shim-sidebar relative flex w-[220px] shrink-0 flex-col gap-3 self-start overflow-visible rounded-xl border border-dense-line-strong bg-dense-surface p-4 pr-5 shadow-sm transition-[width] duration-200 ease-out min-h-[calc(100vh-6rem)]">
  <button type="button" class="shim-sidebar-toggle absolute -right-3 top-2.5 z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-dense-line-strong bg-white text-dense-nav-text shadow-sm transition-colors hover:bg-dense-surface-soft" aria-label="사이드 패널 접기·펼치기" aria-expanded="true" aria-controls="shim-sidebar-admin-nav"></button>
  <h2 class="shim-sidebar-title shim-sidebar-heading-row mb-2 mt-0 flex min-h-[1.75rem] items-center gap-2 text-lg font-extrabold tracking-tight text-dense-text">
    <span class="shim-sidebar-heading-stack min-w-0 flex flex-1 flex-col gap-0.5">
      <span class="shim-sidebar-heading-text min-w-0 truncate pl-1 leading-snug">{{ product_nav_short | default('SHIM') }}</span>
      {% if brand_nav_show_subtitle %}
      <span class="shim-sidebar-heading-sub min-w-0 truncate pl-1 text-[11px] font-semibold leading-snug text-dense-muted">{{ product_display_name | default('SHIM') }}</span>
      {% endif %}
    </span>
    <span class="shim-sidebar-heading-emoji" aria-hidden="true">
      <svg class="shim-sidebar-heading-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </span>
  </h2>
  <nav id="shim-sidebar-admin-nav" class="flex flex-col gap-1" aria-label="관리자 메뉴">
    <a href="/admin/dashboard" class="shim-side-link {% if path == '/admin/dashboard' %}bg-dense-blue-soft text-dense-blue{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
      <svg class="shim-side-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5h5v5"/></svg>
      <span class="shim-nav-label min-w-0 truncate font-semibold">대시보드</span>
    </a>
    <a href="/admin/leave/calendar" class="shim-side-link {% if path.startswith('/admin/leave/calendar') %}bg-dense-blue-soft text-dense-blue{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
      <svg class="shim-side-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M3.5 9.5h17"/></svg>
      <span class="shim-nav-label min-w-0 truncate font-semibold">연차 캘린더</span>
    </a>
    <a href="/admin/leave/timeline" class="shim-side-link {% if path.startswith('/admin/leave/timeline') %}bg-dense-blue-soft text-dense-blue{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
      <svg class="shim-side-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="M7 16V8M12 16V5M17 16v-3"/></svg>
      <span class="shim-nav-label min-w-0 truncate font-semibold">신청 타임라인</span>
    </a>
    <a href="/admin/holidays" class="shim-side-link {% if path.startswith('/admin/holidays') %}bg-dense-blue-soft text-dense-blue{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
      <svg class="shim-side-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4M16 4v4M4 10h16"/></svg>
      <span class="shim-nav-label min-w-0 truncate font-semibold">공휴일 관리</span>
    </a>
    <a href="/admin/master" class="shim-side-link {% if path.startswith('/admin/master') %}bg-dense-blue-soft text-dense-blue{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
      <svg class="shim-side-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20"/></svg>
      <span class="shim-nav-label min-w-0 truncate font-semibold">마스터 관리</span>
    </a>
    <a href="/admin/users" class="shim-side-link {% if path.startswith('/admin/users') %}bg-dense-blue-soft text-dense-blue{% else %}text-dense-nav-text hover:bg-dense-surface-soft{% endif %}">
      <svg class="shim-side-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.8 18a5.2 5.2 0 0 1 10.4 0"/><circle cx="17" cy="9" r="2.2"/><path d="M14.9 18a4 4 0 0 1 6.3-3.2"/></svg>
      <span class="shim-nav-label min-w-0 truncate font-semibold">사용자 관리</span>
    </a>
  </nav>
</aside>
