{% extends "base.html" %}

{% block content %}
<div class="fade-in space-y-6 bg-dense-bg pb-2">
    <!-- Header Section -->
    <div class="mb-6 flex min-w-0 flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div class="min-w-0 shrink">
            <h2 class="text-[26px] font-extrabold tracking-tight text-dense-text">🏖️ 공휴일/연휴 관리</h2>
            <p class="mt-1 text-sm font-semibold text-dense-muted">회사 창립기념일, 현충일 등 연차 차감에서 제외할 공휴일을 등록 및 해제합니다.</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <form action="/admin/holidays" method="GET" class="flex items-center gap-2">
                <select name="year" onchange="this.form.submit()" class="w-24 rounded-xl border border-dense-line px-2.5 py-1.5 text-xs bg-dense-surface font-semibold focus:ring-1 focus:ring-dense-blue">
                    {% for y in year_options %}
                    <option value="{{ y }}" {% if selected_year == y %}selected{% endif %}>{{ y }}년</option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </div>

    <!-- 2컬럼 레이아웃 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <!-- 공휴일 추가 폼 -->
        <div class="rounded-2xl border border-dense-line bg-dense-surface p-4 space-y-3 text-xs font-semibold self-start shadow-sm">
            <p class="text-xs font-extrabold text-dense-text">📅 신규 공휴일 등록</p>
            <form id="holidayCreateForm" class="space-y-2.5">
                <div>
                    <label class="block mb-1 text-dense-muted text-[11px]">공휴일 날짜</label>
                    <input type="date" name="holiday_date" required
                           class="w-full border border-dense-line rounded-xl p-2 bg-dense-surface font-bold text-dense-text text-xs shadow-sm focus:border-dense-blue focus:ring-dense-blue"
                           value="{{ '%04d-01-01'|format(selected_year) }}">
                </div>
                <div>
                    <label class="block mb-1 text-dense-muted text-[11px]">공휴일 이름</label>
                    <input type="text" name="holiday_name" required maxlength="50" placeholder="예: 설 연휴, 어린이날"
                           class="w-full border border-dense-line rounded-xl p-2 bg-dense-surface font-bold text-dense-text text-xs shadow-sm focus:border-dense-blue focus:ring-dense-blue">
                </div>
                <div class="pt-1">
                    <button type="submit"
                            class="w-full px-3.5 py-2.5 rounded-xl bg-dense-green text-white font-bold hover:brightness-95 transition-all shadow-xs">
                        새 공휴일 추가
                    </button>
                </div>
            </form>
        </div>

        <!-- 공휴일 목록 -->
        <div class="lg:col-span-2 rounded-2xl border border-dense-line bg-dense-surface p-4 space-y-3 text-xs font-semibold shadow-sm">
            <p class="text-xs font-extrabold text-dense-text">📋 현재 등록된 공휴일 목록 ({{ selected_year }}년 전체)</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {% for h in holidays %}
                <div class="flex flex-col sm:flex-row gap-2 items-center rounded-xl border border-dense-grid bg-dense-surface-soft p-2 text-xs">
                    <input type="date" id="date-{{ h.id }}" value="{{ h.date.strftime('%Y-%m-%d') }}"
                           class="border border-dense-line rounded-xl px-2 py-1 w-full sm:w-28 font-bold bg-dense-surface focus:ring-1 focus:ring-dense-blue text-dense-text">
                    <input type="text" id="name-{{ h.id }}" value="{{ h.name }}" maxlength="50"
                           class="border border-dense-line rounded-xl px-2 py-1 w-full sm:flex-1 font-bold bg-dense-surface focus:ring-1 focus:ring-dense-blue text-dense-text">
                    <div class="flex gap-1.5 w-full sm:w-auto shrink-0 justify-end">
                        <button type="button" onclick="updateHoliday({{ h.id }}, this)"
                                class="px-2.5 py-1.5 bg-dense-surface border border-dense-line hover:bg-dense-blue-soft hover:text-dense-blue rounded-lg font-bold shadow-2xs transition-colors text-[10px] text-dense-blue">
                            수정
                        </button>
                        <button type="button" onclick="deleteHoliday({{ h.id }}, this)"
                                class="px-2.5 py-1.5 bg-dense-danger-soft border border-dense-danger-soft hover:bg-dense-danger hover:text-white rounded-lg font-bold text-dense-danger shadow-2xs transition-colors text-[10px]">
                            삭제
                        </button>
                    </div>
                </div>
                {% else %}
                <div class="col-span-2 flex flex-col items-center justify-center gap-2 rounded-xl border border-dense-grid bg-dense-surface-soft p-4 py-12 text-center">
                    <span class="text-3xl">📅</span>
                    <p class="text-xs font-bold text-dense-text">등록된 공휴일이 없습니다.</p>
                    <p class="text-[10px] text-dense-muted">새로운 공휴일을 등록하여 연차 신청 제한 일정을 관리해 보세요.</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<script>
async function postForm(url, formData) {
    const res = await fetch(url, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
        throw new Error(data.message || data.detail || '요청 처리 중 오류가 발생했습니다.');
    }
    return data;
}

document.getElementById('holidayCreateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const formData = new FormData(e.target);
    simulateButtonLoading(btn, async () => {
        try {
            const data = await postForm('/api/admin/holiday/create', formData);
            showToastAndReload(data.message || '등록되었습니다.', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
});

async function updateHoliday(id, btn) {
    const holidayName = document.getElementById(`name-${id}`).value.trim();
    const holidayDate = document.getElementById(`date-${id}`).value;

    const formData = new FormData();
    formData.append('holiday_id', id);
    formData.append('holiday_name', holidayName);
    formData.append('holiday_date', holidayDate);

    simulateButtonLoading(btn, async () => {
        try {
            const data = await postForm('/api/admin/holiday/update', formData);
            showToastAndReload(data.message || '수정되었습니다.', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
}

async function deleteHoliday(id, btn) {
    if (!await shimModal.confirm('해당 공휴일을 삭제하시겠습니까?', { destructive: true })) {
        return;
    }
    const formData = new FormData();
    formData.append('holiday_id', id);

    simulateButtonLoading(btn, async () => {
        try {
            const data = await postForm('/api/admin/holiday/delete', formData);
            showToastAndReload(data.message || '삭제되었습니다.', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
}
</script>
{% endblock %}
