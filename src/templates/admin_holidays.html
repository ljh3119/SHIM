{% extends "base.html" %}

{% block content %}
<div class="fade-in space-y-4 bg-dense-bg pb-2">
    <!-- Header Section -->
    <div class="mb-4 flex min-w-0 flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div class="min-w-0 shrink">
            <h2 class="text-xl font-semibold tracking-tight text-dense-text">공휴일 / 연휴 관리</h2>
            <p class="mt-0.5 text-xs text-dense-muted">창립기념일 등 연차 차감에서 제외할 공휴일을 등록 및 해제합니다.</p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
            <form action="/admin/holidays" method="GET" class="flex items-center gap-1.5">
                <select name="year" onchange="this.form.submit()" class="w-24 rounded-[4px] border border-dense-line px-2 py-1 text-xs font-medium bg-dense-surface text-dense-text focus:border-dense-blue focus:ring-1 focus:ring-dense-blue">
                    {% for y in year_options %}
                    <option value="{{ y }}" {% if selected_year == y %}selected{% endif %}>{{ y }}년</option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </div>

    <!-- 2컬럼 레이아웃 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-3.5">
        <!-- 공휴일 추가 폼 -->
        <div class="rounded-[6px] border border-dense-line bg-dense-surface p-3.5 space-y-2.5 text-xs self-start">
            <p class="text-xs font-semibold text-dense-text">신규 공휴일 등록</p>
            <form id="holidayCreateForm" class="space-y-2">
                <div>
                    <label class="block mb-0.5 text-dense-muted text-[11px] font-medium">공휴일 날짜</label>
                    <input type="date" name="holiday_date" required
                           class="w-full border border-dense-line rounded-[4px] px-2 py-1 bg-dense-surface font-mono text-dense-text text-xs focus:border-dense-blue focus:ring-1 focus:ring-dense-blue"
                           value="{{ '%04d-01-01'|format(selected_year) }}">
                </div>
                <div>
                    <label class="block mb-0.5 text-dense-muted text-[11px] font-medium">공휴일 이름</label>
                    <input type="text" name="holiday_name" required maxlength="50" placeholder="예: 설 연휴, 창립기념일"
                           class="w-full border border-dense-line rounded-[4px] px-2 py-1 bg-dense-surface text-dense-text text-xs focus:border-dense-blue focus:ring-1 focus:ring-dense-blue">
                </div>
                <div class="pt-1">
                    <button type="submit"
                            class="w-full px-3 py-1.5 rounded-[4px] bg-dense-blue text-white font-medium hover:brightness-95 transition-all text-xs">
                        새 공휴일 추가
                    </button>
                </div>
            </form>
        </div>

        <!-- 공휴일 목록 -->
        <div class="lg:col-span-2 rounded-[6px] border border-dense-line bg-dense-surface p-3.5 space-y-2.5 text-xs">
            <p class="text-xs font-semibold text-dense-text">현재 등록된 공휴일 목록 ({{ selected_year }}년)</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {% for h in holidays %}
                <div class="flex flex-col sm:flex-row gap-1.5 items-center rounded-[4px] border border-dense-line bg-dense-surface p-2 text-xs">
                    <input type="date" id="date-{{ h.id }}" value="{{ h.date.strftime('%Y-%m-%d') }}"
                           class="border border-dense-line rounded-[3px] px-1.5 py-0.5 w-full sm:w-28 font-mono bg-dense-surface focus:border-dense-blue focus:ring-1 focus:ring-dense-blue text-dense-text text-xs">
                    <input type="text" id="name-{{ h.id }}" value="{{ h.name }}" maxlength="50"
                           class="border border-dense-line rounded-[3px] px-1.5 py-0.5 w-full sm:flex-1 bg-dense-surface focus:border-dense-blue focus:ring-1 focus:ring-dense-blue text-dense-text text-xs">
                    <div class="flex gap-1 w-full sm:w-auto shrink-0 justify-end">
                        <button type="button" onclick="updateHoliday({{ h.id }}, this)"
                                class="h-6 px-2 bg-dense-surface border border-dense-line hover:bg-dense-surface-soft hover:text-dense-blue rounded-[3px] transition-colors text-[11px] font-medium text-dense-muted">
                            수정
                        </button>
                        <button type="button" onclick="deleteHoliday({{ h.id }}, this)"
                                class="h-6 px-2 bg-dense-surface border border-dense-line hover:bg-dense-danger-soft/30 hover:text-dense-danger rounded-[3px] transition-colors text-[11px] font-medium text-dense-muted">
                            삭제
                        </button>
                    </div>
                </div>
                {% else %}
                <div class="col-span-2 flex flex-col items-center justify-center gap-1 rounded-[4px] border border-dense-line bg-dense-surface-soft/40 p-4 py-8 text-center">
                    <p class="text-xs font-medium text-dense-text">등록된 공휴일이 없습니다.</p>
                    <p class="text-[11px] text-dense-muted">새로운 공휴일을 등록하여 연차 신청 제한 일정을 관리하세요.</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<script>
async function postForm(url, formData) {
    const res = await fetch(url, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
        throw new Error(data.message || data.detail || '요청 처리 중 오류가 발생했습니다.');
    }
    return data;
}

document.getElementById('holidayCreateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const formData = new FormData(e.target);
    simulateButtonLoading(btn, async () => {
        try {
            const data = await postForm('/api/admin/holiday/create', formData);
            showToastAndReload(data.message || '등록되었습니다.', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
});

async function updateHoliday(id, btn) {
    const holidayName = document.getElementById(`name-${id}`).value.trim();
    const holidayDate = document.getElementById(`date-${id}`).value;

    const formData = new FormData();
    formData.append('holiday_id', id);
    formData.append('holiday_name', holidayName);
    formData.append('holiday_date', holidayDate);

    simulateButtonLoading(btn, async () => {
        try {
            const data = await postForm('/api/admin/holiday/update', formData);
            showToastAndReload(data.message || '수정되었습니다.', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
}

async function deleteHoliday(id, btn) {
    if (!await shimModal.confirm('해당 공휴일을 삭제하시겠습니까?', { destructive: true })) {
        return;
    }
    const formData = new FormData();
    formData.append('holiday_id', id);

    simulateButtonLoading(btn, async () => {
        try {
            const data = await postForm('/api/admin/holiday/delete', formData);
            showToastAndReload(data.message || '삭제되었습니다.', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
}
</script>
{% endblock %}
