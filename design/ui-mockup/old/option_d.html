    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config={theme:{extend:{colors:{'dense-bg':'#f7f8fb','dense-surface':'#ffffff','dense-surface-soft':'#f9fafb','dense-line':'#d0d5dd','dense-line-strong':'#98a2b3','dense-text':'#101828','dense-muted':'#475467','dense-nav-text':'#1d2939','dense-blue':'#175cd3','dense-blue-soft':'#eff8ff','dense-amber':'#b54708','dense-amber-soft':'#fffaeb','dense-green':'#067647','dense-green-soft':'#ecfdf3','dense-gray-soft':'#f2f4f7','dense-danger':'#d92d20','dense-danger-soft':'#fef3f2'}}}}
    </script>
    <style>
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        .fade-in{animation:fadeIn .3s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .shim-side-link{display:flex;align-items:center;gap:.65rem;box-sizing:border-box;min-height:2.625rem;padding:.5rem .65rem;border-radius:.7rem;text-decoration:none;font-size:.8125rem;line-height:1.25}
        .shim-side-svg{width:1.25rem;height:1.25rem;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .cal-table{border-collapse:collapse;width:100%;table-layout:fixed}
        .cal-table th,.cal-table td{border:1px solid #d0d5dd;text-align:center;vertical-align:middle}
        .cal-table thead th{background:#f9fafb;font-size:10px;font-weight:600;color:#475467;padding:4px 2px;position:sticky;top:0;z-index:5}
        .cal-table tbody td{padding:3px 1px;font-size:10px}
        .cal-table .sticky-col{position:sticky;left:0;z-index:10;background:#fff}
        .cal-table thead .sticky-col{z-index:15;background:#f9fafb}
        .cal-table th.col-day{white-space:normal;padding:3px 1px;font-size:7px;line-height:1.15}
        .cal-table th.col-day .day-num{display:block;font-weight:700;font-size:9px;line-height:1.1}
        .cal-table th.col-day .weekday-label{display:block;font-size:7px;line-height:1.1;margin-top:1px}
        .cal-table th.col-day .holiday-chip{display:block;margin:2px auto 0;font-size:6px;padding:0 1px;background:#d92d20;color:#fff;border-radius:2px}
        .cal-table .day-block{width:100%;min-height:1.45rem;height:1.45rem;margin:0;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:9px;font-weight:700;line-height:1;letter-spacing:-.04em;border:1px solid rgba(255,255,255,.25);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.2);cursor:default;background:#175cd3;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
        .day-block.half{background:linear-gradient(180deg,#fde68a 0%,#f79009 100%);border-color:rgba(181,71,8,.35);color:#1c1917;text-shadow:0 1px 0 rgba(255,255,255,.35)}
        .day-block.full{background:linear-gradient(180deg,#f97066 0%,#d92d20 100%);border-color:rgba(217,45,32,.45)}
        .weekend-head{color:#d92d20!important;background:#fef3f2!important}
        .holiday-head{color:#d92d20!important;background:#fef3f2!important}
    </style>
</head>
<body class="min-h-screen bg-dense-bg text-dense-text antialiased flex flex-col">

                            <h3 class="text-sm font-extrabold text-dense-text mb-3">최근 신청</h3>
                            <div class="space-y-2">
                                <div class="flex items-center justify-between py-1.5 border-b border-dense-line/50">
                                    <div><span class="text-xs font-bold text-dense-nav-text">06/25</span><span class="ml-1 text-[10px] font-semibold text-dense-muted">2h</span></div>
                                    <span class="text-[10px] font-extrabold text-dense-amber bg-dense-amber-soft px-1.5 py-0.5 rounded-full border border-dense-amber/20">대기</span>
                                </div>
                                <div class="flex items-center justify-between py-1.5 border-b border-dense-line/50">
                                    <div><span class="text-xs font-bold text-dense-nav-text">06/18</span><span class="ml-1 text-[10px] font-semibold text-dense-muted">8h</span></div>
                                    <span class="text-[10px] font-extrabold text-dense-green bg-dense-green-soft px-1.5 py-0.5 rounded-full border border-dense-green/20">승인</span>
                                </div>
                                <div class="flex items-center justify-between py-1.5 border-b border-dense-line/50">
                                    <div><span class="text-xs font-bold text-dense-nav-text">06/10</span><span class="ml-1 text-[10px] font-semibold text-dense-muted">4h</span></div>
                                    <span class="text-[10px] font-extrabold text-dense-green bg-dense-green-soft px-1.5 py-0.5 rounded-full border border-dense-green/20">승인</span>
                                </div>
                                <div class="flex items-center justify-between py-1.5">
                                    <div><span class="text-xs font-bold text-dense-nav-text">06/03</span><span class="ml-1 text-[10px] font-semibold text-dense-muted">8h</span></div>
                                    <span class="text-[10px] font-extrabold text-dense-green bg-dense-green-soft px-1.5 py-0.5 rounded-full border border-dense-green/20">승인</span>
                                </div>
                            </div>
                            <a href="#" class="mt-2 block text-[11px] font-bold text-dense-blue hover:underline text-right">전체 내역 →</a>
                        </div>
                    </div>

                    <!-- 우측: 팀/프로젝트 캘린더 -->
                    <div class="min-w-0 flex-1">
                        <div class="rounded-[18px] border border-dense-line bg-dense-surface p-5 shadow-sm">
                            <div class="mb-4 flex items-center justify-between border-b border-dense-line pb-4">
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center gap-2">
                                        <button class="rounded-lg border border-dense-line bg-dense-surface p-1.5 text-dense-nav-text hover:bg-dense-surface-soft"><svg viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></button>
                                        <h3 class="text-lg font-extrabold tracking-tight text-dense-text w-24 text-center">2026년 6월</h3>
                                        <button class="rounded-lg border border-dense-line bg-dense-surface p-1.5 text-dense-nav-text hover:bg-dense-surface-soft"><svg viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg></button>
                                    </div>

                                <div class="inline-flex rounded-xl bg-dense-surface-soft p-0.5 border border-dense-line">
                                    <button id="btn-timeline" onclick="switchView('timeline')" class="rounded-lg px-3 py-1 text-xs font-bold text-dense-blue bg-dense-surface shadow-sm">타임라인</button>
                                    <button id="btn-calendar" onclick="switchView('calendar')" class="rounded-lg px-3 py-1 text-xs font-bold text-dense-muted hover:text-dense-text">캘린더</button>

                            <div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-[10px] font-bold text-dense-muted">
                                <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded bg-dense-blue shadow-sm"></span>반일 이하</span>
                                <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded bg-gradient-to-b from-[#fde68a] to-[#f79009] shadow-sm"></span>반일(4h)</span>
                                <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded bg-gradient-to-b from-[#f97066] to-[#d92d20] shadow-sm"></span>전일(8h)</span>
                            </div>

                            <div id="timeline-view-container" class="overflow-x-auto rounded-xl border border-dense-line">
                                <table class="cal-table" style="min-width:800px;">
                                    <thead><tr>
                                        <th class="sticky-col text-left !px-2 !py-2" style="width:4.25rem">이름</th>
                                        <th style="width:5rem" class="text-center px-1">팀</th>
                                        <th id="th-days"></th>
                                    </tr></thead>
                                    <tbody class="divide-y divide-dense-line" id="tlBody"></tbody>
                                </table>
                            </div>

                            <!-- Calendar Grid View Container -->
                            <div id="calendar-view-container" class="rounded-xl border border-dense-line bg-dense-surface p-4 hidden">
                                <div class="mb-2 grid grid-cols-7 gap-2">
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-danger">일</div>
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-muted">월</div>
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-muted">화</div>
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-muted">수</div>
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-muted">목</div>
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-muted">금</div>
                                    <div class="text-center text-xs font-extrabold py-2 rounded-lg bg-dense-surface-soft border border-dense-line/40 text-dense-blue">토</div>
                                </div>
                                <div class="grid grid-cols-7 gap-2" id="calendar-grid-body"></div>
                            </div>

    <footer class="mt-auto border-t border-dense-line bg-dense-surface"><div class="mx-auto max-w-[90rem] px-4 py-6 sm:px-6 lg:px-8"><p class="text-center text-sm text-dense-muted">&copy; 2026 SHIM. v1.7.3</p></div></footer>

    <script>
    const year=2026,month=6,daysInMonth=30;
    const weekdays=['월','화','수','목','금','토','일'];
    const firstDayMon=(new Date(year,month-1,1).getDay()+6)%7;
    const holidays={6:'현충일'};

    let thHtml='';
    for(let d=1;d<=daysInMonth;d++){
        const wd=(firstDayMon+d-1)%7;const isWE=wd>=5;const hol=holidays[d];
        let cls='col-day';if(hol)cls+=' holiday-head';else if(isWE)cls+=' weekend-head';
        thHtml+=`<th class="${cls}"><span class="day-num">${d}</span><span class="weekday-label">(${weekdays[wd]})</span>${hol?`<span class="holiday-chip">${hol}</span>`:''}</th>`;
    }
    document.getElementById('th-days').outerHTML=thHtml;

    const members=[
        {name:'★ 홍길동',team:'설계팀',isMe:true,leaves:{10:4,25:8}},
        {name:'김영희',team:'개발팀',leaves:{3:8,10:8,11:8}},
        {name:'이철수',team:'설계팀',leaves:{6:4,18:8}},
        {name:'박민수',team:'PM',leaves:{15:8}},
        {name:'정소연',team:'개발팀',leaves:{5:2,20:8,21:8}},
        {name:'최지훈',team:'QA팀',leaves:{12:8,13:8}},
        {name:'한수진',team:'설계팀',leaves:{9:4}},
        {name:'오영호',team:'개발팀',leaves:{22:8}},
    ];

    let bodyHtml='';
    members.forEach(m=>{
        const rowCls=m.isMe?'bg-dense-blue-soft/20 hover:bg-dense-blue-soft/40':'hover:bg-dense-surface-soft';
        bodyHtml+=`<tr class="transition-colors ${rowCls}">`;
        bodyHtml+=`<td class="sticky-col whitespace-nowrap !px-2 !py-2 text-left text-xs font-bold ${m.isMe?'text-dense-blue':'text-dense-nav-text'}" style="width:4.25rem">${m.name}</td>`;
        bodyHtml+=`<td class="text-center px-1" style="width:5rem"><span class="inline-flex items-center rounded-full px-1.5 py-0.5 text-[9px] font-semibold bg-dense-surface-soft border border-dense-line">${m.team}</span></td>`;
        for(let d=1;d<=daysInMonth;d++){
            const wd=(firstDayMon+d-1)%7;const isWE=wd>=5;const hol=holidays[d];
            const h=m.leaves[d];
            if(h){const cls=h>=8?'full':h>=4?'half':'';bodyHtml+=`<td><div class="day-block ${cls}">${h}h</div></td>`;}
            else bodyHtml+=`<td class="${isWE||hol?'bg-dense-gray-soft/40':''}"></td>`;
        }
        bodyHtml+='</tr>';
    });
    document.getElementById('tlBody').innerHTML=bodyHtml;

    function selectEasyDate(dateStr) {
        document.getElementById('easy-date').value = dateStr;
    }

    function switchView(view) {
        const btnTimeline = document.getElementById('btn-timeline');
        const btnCalendar = document.getElementById('btn-calendar');
        const timelineContainer = document.getElementById('timeline-view-container');
        const calendarContainer = document.getElementById('calendar-view-container');
        
        if (view === 'timeline') {
            btnTimeline.className = "rounded-lg px-3 py-1 text-xs font-bold text-dense-blue bg-dense-surface shadow-sm";
            btnCalendar.className = "rounded-lg px-3 py-1 text-xs font-bold text-dense-muted hover:text-dense-text";
            timelineContainer.classList.remove('hidden');
            calendarContainer.classList.add('hidden');
        } else {
            btnTimeline.className = "rounded-lg px-3 py-1 text-xs font-bold text-dense-muted hover:text-dense-text";
            btnCalendar.className = "rounded-lg px-3 py-1 text-xs font-bold text-dense-blue bg-dense-surface shadow-sm";
            timelineContainer.classList.add('hidden');
            calendarContainer.classList.remove('hidden');
            renderCalendarGrid();
        }
    }

    function renderCalendarGrid() {
        const gridBody = document.getElementById('calendar-grid-body');
        if (!gridBody) return;
        
        const startOffset = 1; 
        const totalDays = 30;
        
        let html = '';
        
        // 이전 달 빈 칸
        for (let i = 0; i < startOffset; i++) {
            html += `<div class="min-h-[9rem] rounded-xl border border-dashed border-dense-line bg-dense-surface-soft/40 opacity-40"></div>`;
        }
        
        // 6월 일자들
        for (let d = 1; d <= totalDays; d++) {
            const dayOfWeek = (startOffset + d - 1) % 7;
            const isWE = (dayOfWeek === 0 || dayOfWeek === 6);
            const hol = holidays[d];
            const isBlocked = isWE || hol;
            
            let dateCls = "text-xs font-extrabold ";
            if (hol || dayOfWeek === 0) dateCls += "text-dense-danger";
            else if (dayOfWeek === 6) dateCls += "text-dense-blue";
            else dateCls += "text-dense-text";
            
            let leaveChipsHtml = '<div class="flex-1 overflow-y-auto max-h-[96px] space-y-1 pr-0.5 mt-1">';
            let myLeave = null;
            
            members.forEach(m => {
                const h = m.leaves[d];
                if (h) {
                    const isMe = m.name.includes('홍길동');
                    if (isMe) myLeave = h;
                    
                    let chipCls = 'rounded px-1.5 py-0.5 text-[9px] font-bold truncate leading-tight shadow-sm border transform hover:scale-[1.02] transition-transform cursor-default ';
                    if (h >= 8) chipCls += 'bg-red-50 text-red-700 border border-red-200';
                    else if (h >= 4) chipCls += 'bg-amber-50 text-amber-700 border border-amber-200';
                    else chipCls += 'bg-blue-50 text-blue-700 border border-blue-200';
                    
                    const displayName = m.name;
                    leaveChipsHtml += `<div class="${chipCls}" title="${m.name}: ${h}h">
                        ${displayName} <span class="opacity-75 font-semibold text-[8px] ml-0.5">${h}h</span>
                    </div>`;
                }
            });
            leaveChipsHtml += '</div>';
            
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            let cellAttr = '';
            let cellCls = "min-h-[9rem] rounded-xl border p-2 flex flex-col justify-between transition-all bg-dense-surface border-dense-line hover:shadow-sm relative group ";
            
            if (!myLeave && !isBlocked) {
                cellAttr = `onclick="selectEasyDate('${dateStr}')" title="클릭하여 좌측 간편신청 날짜로 선택"`;
                cellCls += "cursor-pointer hover:bg-dense-blue-soft/30 hover:border-dense-blue";
            } else if (isBlocked) {
                cellCls += "bg-dense-gray-soft/20";
            }
            
            const plusIcon = (!myLeave && !isBlocked) ? `<div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"><span class="text-xl font-bold text-dense-blue/60">+</span></div>` : '';
            
            html += `
            <div class="${cellCls}" ${cellAttr}>
                <div class="flex items-center justify-between w-full leading-none mb-1">
                     <span class="${dateCls}">${d}</span>
                     ${hol ? `<span class="truncate text-[8px] font-bold text-dense-danger bg-dense-danger-soft px-1 rounded border border-dense-danger/10" title="${hol}">${hol}</span>` : ''}
                </div>
                ${leaveChipsHtml}
                ${plusIcon}
            </div>
            `;
        }
        
        // 다음 달 빈 칸 채우기 (마지막 주)
        const endOffset = (startOffset + totalDays) % 7;
        if (endOffset > 0) {
            const remaining = 7 - endOffset;
            for (let i = 0; i < remaining; i++) {
                html += `<div class="min-h-[9rem] rounded-xl border border-dashed border-dense-line bg-dense-surface-soft/40 opacity-40"></div>`;
            }
        }
        
        gridBody.innerHTML = html;
    }
    </script>
</body>
</html>
