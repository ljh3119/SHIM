<!doctype html>
<html lang="ko">
<!--
  레거시 참고용: Original vs Dense iframe 비교 템플릿.
  현행 샘플 목차: ../../../galleries/samples-hub.html
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1360" />
  <title>LAMS 전체 페이지 디자인 비교 템플릿</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --surface:#ffffff;
      --line:#d1d5db;
      --line-soft:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --blue:#175cd3;
      --blue-soft:#eff8ff;
      --amber:#b54708;
      --amber-soft:#fffaeb;
      --focus:#2563eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-width:1320px;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .page{width:1280px; margin:0 auto; padding:28px 0 48px}
    .top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px}
    h1{margin:0; font-size:28px; letter-spacing:-.4px}
    .meta{color:var(--muted); font-size:13px; font-weight:650}
    .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
    .tabs{display:flex; gap:8px; flex-wrap:wrap}
    .tab{
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:#374151;
      padding:8px 13px;
      font:inherit;
      font-size:12px;
      font-weight:850;
      cursor:pointer;
    }
    .tab.active{border-color:#b2ddff; background:var(--blue-soft); color:var(--blue)}
    .page-select{
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:#374151;
      padding:8px 10px;
      font:inherit;
      font-size:12px;
      font-weight:750;
      min-width:240px;
    }
    .hint{
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      padding:10px 12px;
      color:#4b5563;
      font-size:12px;
      font-weight:650;
      margin-bottom:14px;
    }
    .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
    .card{border:1px solid var(--line); border-radius:16px; background:#fff; overflow:hidden}
    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      padding:12px 14px;
      border-bottom:1px solid var(--line-soft);
    }
    .name{margin:0; font-size:16px; font-weight:850}
    .tag{
      display:inline-block;
      margin-top:6px;
      border:1px solid var(--line-soft);
      border-radius:999px;
      padding:4px 8px;
      background:#f9fafb;
      color:#4b5563;
      font-size:11px;
      font-weight:800;
    }
    .tag.original{color:var(--amber); background:var(--amber-soft); border-color:#fde4c7}
    .tag.current{color:var(--blue); background:var(--blue-soft); border-color:#b2ddff}
    .open{
      border:1px solid #bfdbfe;
      border-radius:10px;
      background:var(--blue-soft);
      color:var(--blue);
      padding:7px 10px;
      font:inherit;
      font-size:12px;
      font-weight:850;
      cursor:pointer;
      white-space:nowrap;
    }
    .open[disabled]{opacity:.4; cursor:not-allowed}
    .preview{height:320px; overflow:hidden; background:#f9fafb}
    iframe{
      width:1280px;
      height:900px;
      border:0;
      transform:scale(.36);
      transform-origin:0 0;
      pointer-events:none;
      background:#fff;
    }
    .empty{
      height:100%;
      display:grid;
      place-items:center;
      text-align:center;
      color:#6b7280;
      font-size:13px;
      font-weight:700;
      padding:20px;
      line-height:1.6;
    }
    .viewer{position:fixed; inset:0; z-index:100; display:none; background:rgba(17,24,39,.72); padding:24px}
    .viewer.open{display:block}
    .viewer-panel{
      width:1240px;
      max-height:calc(100vh - 48px);
      margin:0 auto;
      overflow:hidden;
      border-radius:16px;
      background:#fff;
      box-shadow:0 24px 80px rgba(0,0,0,.32);
    }
    .viewer-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line-soft)}
    .viewer-title{margin:0; font-size:16px; font-weight:850}
    .viewer-close{
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:#374151;
      padding:7px 11px;
      font:inherit;
      font-size:12px;
      font-weight:850;
      cursor:pointer;
    }
    .viewer-body{max-height:calc(100vh - 108px); overflow:auto; background:#f3f4f6; padding:12px}
    .viewer-body iframe{
      transform:none;
      width:100%;
      min-height:900px;
      pointer-events:auto;
      border-radius:10px;
      box-shadow:0 0 0 1px rgba(17,24,39,.08);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top">
      <h1>LAMS 전체 페이지 디자인 비교</h1>
      <div class="meta">Original vs Dense / 페이지별 비교 템플릿</div>
    </section>

    <section class="toolbar">
      <div class="tabs">
        <button class="tab active" type="button" data-role="admin">관리자</button>
        <button class="tab" type="button" data-role="user">사용자</button>
      </div>
      <select class="page-select" id="pageSelect" aria-label="비교 페이지 선택"></select>
    </section>

    <section class="hint" id="hint"></section>
    <section class="grid" id="gallery"></section>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <section class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="viewer-head">
        <h2 class="viewer-title" id="viewerTitle">크게 보기</h2>
        <button class="viewer-close" id="viewerClose" type="button">닫기</button>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </section>
  </div>

  <script>
    const roleTabs = document.querySelectorAll(".tab");
    const pageSelect = document.getElementById("pageSelect");
    const hint = document.getElementById("hint");
    const gallery = document.getElementById("gallery");
    const viewer = document.getElementById("viewer");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerBody = document.getElementById("viewerBody");
    const viewerClose = document.getElementById("viewerClose");

    const compareMap = {
      admin: [
        {
          key: "dashboard",
          label: "관리자 대시보드",
          note: "현재 연결됨",
          original: "../samples/admin/original.html",
          dense: "../../../samples/admin/dense-operations-console.html",
        },
        {
          key: "users",
          label: "사원 관리",
          note: "샘플 추가 예정",
          original: "",
          dense: "",
        },
        {
          key: "timeline",
          label: "연차 타임라인",
          note: "샘플 추가 예정",
          original: "",
          dense: "",
        },
        {
          key: "calendar",
          label: "연차 캘린더",
          note: "샘플 추가 예정",
          original: "",
          dense: "",
        },
      ],
      user: [
        {
          key: "dashboard",
          label: "사용자 대시보드",
          note: "현재 연결됨",
          original: "../samples/user/original.html",
          dense: "../../../samples/user/dense-operations-console.html",
        },
      ],
    };

    let currentRole = "admin";

    function buildPageOptions() {
      pageSelect.innerHTML = "";
      compareMap[currentRole].forEach((page, idx) => {
        const option = document.createElement("option");
        option.value = page.key;
        option.textContent = page.label;
        if (idx === 0) option.selected = true;
        pageSelect.appendChild(option);
      });
    }

    function createCard(title, tagClass, tagLabel, path, roleLabel, pageLabel) {
      const card = document.createElement("article");
      card.className = "card";

      if (!path) {
        card.innerHTML =
          `<div class="card-head">` +
            `<div><h2 class="name">${title}</h2><span class="tag ${tagClass}">${tagLabel}</span></div>` +
            `<button class="open" type="button" disabled>크게 보기</button>` +
          `</div>` +
          `<div class="preview"><div class="empty">샘플 파일이 아직 없습니다.<br />해당 페이지 샘플 생성 후 경로를 연결하세요.</div></div>`;
        return card;
      }

      card.innerHTML =
        `<div class="card-head">` +
          `<div><h2 class="name">${title}</h2><span class="tag ${tagClass}">${tagLabel}</span></div>` +
          `<button class="open" type="button">크게 보기</button>` +
        `</div>` +
        `<div class="preview"><iframe title="${roleLabel} ${pageLabel} ${title} preview" src="${path}"></iframe></div>`;

      card.querySelector(".open").addEventListener("click", () => {
        viewerTitle.textContent = `${roleLabel} / ${pageLabel} / ${title}`;
        viewerBody.innerHTML = `<iframe title="${viewerTitle.textContent}" src="${path}"></iframe>`;
        viewer.classList.add("open");
        viewer.setAttribute("aria-hidden", "false");
        viewerClose.focus();
      });

      return card;
    }

    function renderPage() {
      const selected = compareMap[currentRole].find((p) => p.key === pageSelect.value) || compareMap[currentRole][0];
      const roleLabel = currentRole === "admin" ? "관리자" : "사용자";
      hint.textContent = `${roleLabel} / ${selected.label} - ${selected.note}`;

      gallery.replaceChildren(
        createCard("Original", "original", "기존 화면", selected.original, roleLabel, selected.label),
        createCard("Dense Console", "current", "최종안", selected.dense, roleLabel, selected.label),
      );
    }

    roleTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        currentRole = tab.dataset.role;
        roleTabs.forEach((btn) => btn.classList.toggle("active", btn === tab));
        buildPageOptions();
        renderPage();
      });
    });

    pageSelect.addEventListener("change", renderPage);

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      viewerBody.innerHTML = "";
    }
    viewerClose.addEventListener("click", closeViewer);
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && viewer.classList.contains("open")) closeViewer();
    });

    buildPageOptions();
    renderPage();
  </script>
</body>
</html>
