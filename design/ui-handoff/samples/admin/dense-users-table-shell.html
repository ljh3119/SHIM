<!DOCTYPE html>
<html lang="ko">
<!--
  목적: 사원 계정 관리 — 툴바 + 정렬 가능한 넓은 표 Dense 시안.
  대응: src/templates/admin_users.html
  토큰: ../reference/dense-tokens.css · CDN 없음 · 정적 샘플
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAMS 사원 관리 — Dense 샘플</title>
  <link rel="stylesheet" href="../reference/dense-tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1180px;
      color: var(--text);
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      width: 1160px;
      margin: 0 auto;
      padding: 24px 0 44px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: start;
    }
    .sidebar {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      align-self: start;
      min-height: calc(100vh - 48px);
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 850;
      margin-bottom: 16px;
    }
    .side-title {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 850;
    }
    .side-nav { display: grid; gap: 5px; }
    .side-nav a {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--nav-text);
      padding: 10px 11px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 750;
    }
    .side-nav a.active {
      color: var(--blue);
      background: var(--blue-soft);
    }
    .main { min-width: 0; display: grid; gap: 16px; }
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }
    .sub {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .toolbar select {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 650;
      background: #fff;
      color: var(--text);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: default;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn.primary {
      background: var(--blue);
      color: #fff;
    }
    .btn.amber {
      background: var(--amber-soft);
      color: var(--amber);
      border-color: #fec84b;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }
    .scroll {
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: 1020px;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead {
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
    }
    th {
      padding: 11px 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    th a {
      color: var(--nav-text);
      text-decoration: none;
      font-weight: 800;
    }
    th a:hover { color: var(--blue); }
    td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      text-align: center;
    }
    td.left { text-align: left; }
    tr.dim {
      opacity: 0.62;
      background: var(--gray-soft);
    }
    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .avatar.admin {
      background: #f4ebff;
      color: #6941c6;
    }
    .avatar.user {
      background: var(--blue-soft);
      color: var(--blue);
    }
    .avatar.off {
      background: var(--gray-soft);
      color: var(--muted);
    }
    .person strong {
      display: block;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .person span.id {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 650;
    }
    .cell-xs { font-size: 11px; color: var(--muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .leave-edit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    .leave-edit input {
      width: 3.25rem;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      text-align: center;
    }
    .mini {
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #84caff;
      background: var(--blue-soft);
      color: var(--blue);
      cursor: default;
    }
    .badge {
      display: inline-flex;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
      border: 1px solid var(--line);
    }
    .badge.admin-role {
      background: #f4ebff;
      color: #6941c6;
      border-color: #d6bbfb;
    }
    .badge.user-role {
      background: var(--gray-soft);
      color: #344054;
    }
    .badge.on {
      background: var(--green-soft);
      color: var(--green);
      border-color: #abefc6;
    }
    .badge.off {
      background: #fef3f2;
      color: #b42318;
      border-color: #fecdca;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .actions button {
      border: none;
      background: none;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      cursor: default;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar" aria-label="관리자 네비게이션(샘플)">
      <div class="logo">LAMS</div>
      <h2 class="side-title">LAMS Admin</h2>
      <nav class="side-nav">
        <a href="#">대시보드</a>
        <a href="#">연차 캘린더</a>
        <a href="#">연차 타임라인</a>
        <a href="#">공휴일 관리</a>
        <a href="#">마스터 관리</a>
        <a href="#" class="active">사원 관리</a>
      </nav>
    </aside>

    <section class="main">
      <div class="page-head">
        <div>
          <h1>사원 계정 관리</h1>
          <p class="sub">사원 목록을 조회하고 권한 및 상태를 관리합니다.</p>
        </div>
        <div class="toolbar">
          <select disabled aria-label="필터(샘플)">
            <option>전체 계정</option>
            <option>활성</option>
            <option>비활성</option>
          </select>
          <select disabled aria-label="연도(샘플)">
            <option selected>2026년</option>
          </select>
          <button type="button" class="btn primary">+ 신규 사원 등록</button>
          <button type="button" class="btn amber">연차 일괄 설정</button>
        </div>
      </div>

      <div class="panel">
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th style="width: 17%"><a href="#">이름 ▼</a></th>
                <th style="width: 9%"><a href="#">ID</a></th>
                <th style="width: 14%"><a href="#">소속회사</a></th>
                <th style="width: 10%"><a href="#">팀</a></th>
                <th style="width: 15%"><a href="#">연차일수(2026년)</a></th>
                <th style="width: 8%">권한</th>
                <th style="width: 9%">상태</th>
                <th style="width: 18%">작업</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="left">
                  <div class="person">
                    <span class="avatar admin">관</span>
                    <div>
                      <strong>시스템 관리자</strong>
                      <span class="id">admin</span>
                    </div>
                  </div>
                </td>
                <td>admin</td>
                <td><div class="cell-xs" title="-">-</div></td>
                <td><div class="cell-xs">-</div></td>
                <td>-</td>
                <td><span class="badge admin-role">관리자</span></td>
                <td><span class="badge on">재직 중</span></td>
                <td>
                  <div class="actions">
                    <button type="button">비밀번호 초기화</button>
                  </div>
                </td>
              </tr>
              <tr>
                <td class="left">
                  <div class="person">
                    <span class="avatar user">김</span>
                    <div>
                      <strong>김민수</strong>
                      <span class="id">mkim</span>
                    </div>
                  </div>
                </td>
                <td>mkim</td>
                <td><div class="cell-xs" title="LAMS교육주식회사">LAMS교육주식회사</div></td>
                <td><div class="cell-xs">개발</div></td>
                <td>
                  <div class="leave-edit">
                    <input type="text" value="15" readonly />
                    <button type="button" class="mini">저장</button>
                  </div>
                </td>
                <td><span class="badge user-role">일반</span></td>
                <td><span class="badge on">재직 중</span></td>
                <td>
                  <div class="actions">
                    <button type="button">수정</button>
                    <button type="button">비활성</button>
                  </div>
                </td>
              </tr>
              <tr class="dim">
                <td class="left">
                  <div class="person">
                    <span class="avatar off">이</span>
                    <div>
                      <strong>이퇴사</strong>
                      <span class="id">left01</span>
                    </div>
                  </div>
                </td>
                <td>left01</td>
                <td><div class="cell-xs">-</div></td>
                <td><div class="cell-xs">-</div></td>
                <td>
                  <div class="leave-edit">
                    <input type="text" value="0" readonly />
                    <button type="button" class="mini">저장</button>
                  </div>
                </td>
                <td><span class="badge user-role">일반</span></td>
                <td><span class="badge off">비활성</span></td>
                <td>
                  <div class="actions">
                    <button type="button">활성화</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <p style="margin:0;font-size:11px;color:var(--muted);">
        실반영 시 정렬 URL·모달·API 호출은 템플릿과 라우트에 맞춥니다.
      </p>
    </section>
  </main>
</body>
</html>
