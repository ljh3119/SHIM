<!DOCTYPE html>
<html lang="ko">
<!--
  목적: 관리자 월별 연차 캘린더 화면의 그리드 밀도·범례·셀 상태 표현 샘플.
  디자인 토큰: ../reference/dense-tokens.css (토 로컬 보조색만 유지).
  실반영: src/templates/admin_leaves_calendar.html. 데이터·내비게이션 미연동.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAMS 관리자 · 월간 캘린더 Dense 샘플</title>
  <link rel="stylesheet" href="../reference/dense-tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      min-width: 1180px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page { max-width: 1100px; margin: 0 auto; }
    .banner {
      border: 1px solid #fedf89;
      background: var(--amber-soft);
      color: var(--amber);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 750;
      margin-bottom: 16px;
    }
    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; }
    .navfake {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }
    .navfake span {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      background: var(--surface);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid var(--line);
    }

    .cal-wrap {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      overflow: hidden;
    }
    .cal-head {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }
    .cal-head div {
      padding: 10px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 850;
      color: var(--muted);
    }
    .cal-head div.sun { color: #dc2626; }
    .cal-head div.sat { color: var(--blue); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cell {
      min-height: 88px;
      border-right: 1px solid var(--gray-soft);
      border-bottom: 1px solid var(--gray-soft);
      padding: 8px;
      font-size: 12px;
      vertical-align: top;
    }
    .cell:nth-child(7n) { border-right: none; }
    .cell.out { background: #fafafa; color: #98a2b3; }
    .cell .d { font-weight: 850; font-size: 13px; margin-bottom: 6px; }
    .cell.sun .d { color: #dc2626; }
    .cell.sat .d { color: var(--blue); }
    .pill {
      display: block;
      padding: 3px 6px;
      border-radius: 6px;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill.leave { background: var(--blue-soft); color: var(--blue); border: 1px solid #b2ddff; }
    .pill.holiday { background: var(--amber-soft); color: var(--amber); border: 1px solid #fedf89; }
    .pill.team { background: var(--green-soft); color: var(--green); border: 1px solid #abefc6; }
    .pill.warn { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="page">
    <div class="banner">2026년 5월 고정 그리드 더미입니다. 이전/다음 월·필터는 동작하지 않습니다.</div>

    <header class="head">
      <div>
        <h1>연차 캘린더</h1>
        <p style="margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:650">팀·사용자 필터는 서비스와 동일 역할을 가정합니다.</p>
      </div>
      <div class="navfake" aria-hidden="true">
        <span>◀</span>
        <span>2026년 5월</span>
        <span>▶</span>
      </div>
    </header>

    <div class="legend">
      <span><i style="background:var(--blue-soft)"></i>연차 사용</span>
      <span><i style="background:var(--amber-soft)"></i>공휴일</span>
      <span><i style="background:var(--green-soft)"></i>팀 일정(예시)</span>
      <span><i style="background:var(--red-soft)"></i>검증 필요(예시)</span>
    </div>

    <div class="cal-wrap">
      <div class="cal-head">
        <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
      </div>
      <div class="cal-grid">
        <!-- 2026-05-01 = 금요일 → 앞칸 5칸 패딩 -->
        <div class="cell out"><span class="d">26</span></div>
        <div class="cell out"><span class="d">27</span></div>
        <div class="cell out"><span class="d">28</span></div>
        <div class="cell out"><span class="d">29</span></div>
        <div class="cell out"><span class="d">30</span></div>

        <div class="cell"><span class="d">1</span><span class="pill leave">김·반차</span></div>
        <div class="cell sat"><span class="d">2</span></div>

        <div class="cell sun"><span class="d">3</span><span class="pill holiday">어린이날</span></div>
        <div class="cell"><span class="d">4</span><span class="pill leave">이·종일</span></div>
        <div class="cell"><span class="d">5</span></div>
        <div class="cell"><span class="d">6</span></div>
        <div class="cell"><span class="d">7</span></div>
        <div class="cell"><span class="d">8</span></div>
        <div class="cell sat"><span class="d">9</span></div>

        <div class="cell sun"><span class="d">10</span></div>
        <div class="cell"><span class="d">11</span></div>
        <div class="cell"><span class="d">12</span><span class="pill team">전사 회의</span></div>
        <div class="cell"><span class="d">13</span></div>
        <div class="cell"><span class="d">14</span></div>
        <div class="cell"><span class="d">15</span><span class="pill leave">박·오후</span></div>
        <div class="cell sat"><span class="d">16</span></div>

        <div class="cell sun"><span class="d">17</span></div>
        <div class="cell"><span class="d">18</span></div>
        <div class="cell"><span class="d">19</span></div>
        <div class="cell"><span class="d">20</span></div>
        <div class="cell"><span class="d">21</span></div>
        <div class="cell"><span class="d">22</span></div>
        <div class="cell sat"><span class="d">23</span></div>

        <div class="cell sun"><span class="d">24</span></div>
        <div class="cell"><span class="d">25</span><span class="pill warn">중복 신청?</span></div>
        <div class="cell"><span class="d">26</span></div>
        <div class="cell"><span class="d">27</span></div>
        <div class="cell"><span class="d">28</span></div>
        <div class="cell"><span class="d">29</span></div>
        <div class="cell sat"><span class="d">30</span></div>

        <div class="cell sun"><span class="d">31</span></div>
        <div class="cell out"><span class="d">1</span></div>
        <div class="cell out"><span class="d">2</span></div>
        <div class="cell out"><span class="d">3</span></div>
        <div class="cell out"><span class="d">4</span></div>
        <div class="cell out"><span class="d">5</span></div>
        <div class="cell out"><span class="d">6</span></div>
      </div>
    </div>
  </div>
</body>
</html>
