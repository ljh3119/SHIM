<!DOCTYPE html>
<html lang="ko">
<!--
  목적: 로그인 화면 Dense 토큰 정렬 시안 (중앙 카드 · 폼 · 오류 영역).
  대응: src/templates/login.html
  토큰: ./dense-tokens.css · CDN 없음 · 정적 샘플 (동작 없음)
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAMS 로그인 — Dense 샘플</title>
  <link rel="stylesheet" href="./dense-tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .backdrop {
      position: relative;
      width: 100%;
      max-width: 28rem;
      border-radius: 1rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 48px rgba(16, 24, 40, 0.08);
      padding: 2rem 2rem 2.25rem;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.22;
      pointer-events: none;
    }
    .blob-a {
      width: 8rem;
      height: 8rem;
      background: var(--blue);
      top: -2rem;
      right: -2rem;
    }
    .blob-b {
      width: 8rem;
      height: 8rem;
      background: var(--blue-soft);
      bottom: -2.5rem;
      left: -2rem;
      border: 1px solid var(--line);
    }
    .inner { position: relative; z-index: 1; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .brand-mark {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      font-size: 1.125rem;
      display: grid;
      place-items: center;
    }
    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
    }
    .lead {
      margin: 0 0 1.25rem;
      font-size: 0.8125rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .version {
      margin: 0 0 1rem;
      font-size: 0.6875rem;
      color: var(--muted);
      text-align: center;
    }
    .alert {
      margin-bottom: 1rem;
      padding: 0.75rem 0.875rem;
      border-radius: 0.5rem;
      border-left: 4px solid #d92d20;
      background: #fef3f2;
      font-size: 0.8125rem;
      color: #b42318;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .field { margin-bottom: 1rem; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 0.5rem;
      padding: 0.5rem 0.65rem;
      font-size: 0.8125rem;
      color: var(--text);
      background: var(--surface);
    }
    input:focus {
      outline: 2px solid var(--focus);
      outline-offset: 0;
      border-color: var(--blue);
    }
    .submit {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--blue);
      color: #fff;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: default;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.6875rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>
    <div class="inner">
      <div class="brand">
        <span class="brand-mark">L</span>
        <span class="brand-title">LAMS</span>
      </div>
      <h1>환영합니다</h1>
      <p class="lead">계정으로 LAMS에 로그인하세요.</p>
      <p class="version">시스템 버전 v1.1.7 · 샘플 화면</p>

      <div class="alert" role="note">예시: 아이디 또는 비밀번호가 올바르지 않습니다.</div>

      <form action="#" method="post" onsubmit="return false;">
        <div class="field">
          <label for="user_id">아이디</label>
          <input id="user_id" name="user_id" type="text" autocomplete="username" placeholder="" />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        <button type="submit" class="submit">로그인</button>
      </form>
      <p class="hint">실반영 시 action·에러 메시지는 Jinja와 서버 검증에 맞춥니다.</p>
    </div>
  </div>
</body>
</html>
